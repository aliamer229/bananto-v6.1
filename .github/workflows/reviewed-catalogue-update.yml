name: Reviewed catalogue update

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply only when the committed manifest also has apply=true
        required: true
        type: boolean
        default: false
  push:
    branches: [codex/product-catalogue-repair]
    paths:
      - data/reviewed-catalogue-batch-*.json
      - scripts/reviewed-catalogue-update.mjs
      - scripts/reviewed-catalogue-update.test.mjs
      - scripts/lib/reviewed-catalogue-update.mjs
      - scripts/lib/reviewed-catalogue-entry.ts
      - scripts/lib/media-pipeline.mjs
      - src/lib/gameImportForm.ts
      - src/lib/gameZipImport.test.ts
      - .github/workflows/reviewed-catalogue-update.yml
  pull_request:
    paths:
      - data/reviewed-catalogue-batch-*.json
      - scripts/reviewed-catalogue-update.mjs
      - scripts/reviewed-catalogue-update.test.mjs
      - scripts/lib/reviewed-catalogue-update.mjs
      - scripts/lib/reviewed-catalogue-entry.ts
      - scripts/lib/media-pipeline.mjs
      - src/lib/gameImportForm.ts
      - src/lib/gameZipImport.test.ts
      - .github/workflows/reviewed-catalogue-update.yml

permissions:
  contents: read

concurrency:
  group: reviewed-catalogue-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          echo "::add-mask::$ACCOUNT_ID"
          echo "::add-mask::$DATABASE_ID"
      - name: Validate guarded update code
        run: |
          MANIFEST="$(find data -maxdepth 1 -name 'reviewed-catalogue-batch-*.json' -print | sort -V | tail -n 1)"
          test -n "$MANIFEST"
          bun x vitest run scripts/reviewed-catalogue-update.test.mjs src/lib/gameZipImport.test.ts
          node --check scripts/reviewed-catalogue-update.mjs
          MANIFEST="$MANIFEST" node -e "JSON.parse(require('node:fs').readFileSync(process.env.MANIFEST, 'utf8'))"
      - name: Run reviewed batch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          MANIFEST="$(find data -maxdepth 1 -name 'reviewed-catalogue-batch-*.json' -print | sort -V | tail -n 1)"
          test -n "$MANIFEST"
          SAME_REPO_PR="${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/product-catalogue-repair' }}"
          if { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.apply }}" = "true" ]; } || \
             { [ "$SAME_REPO_PR" = "true" ] && jq -e '.apply == true' "$MANIFEST" >/dev/null; }; then
            node scripts/reviewed-catalogue-update.mjs --manifest="$MANIFEST" --apply
          else
            node scripts/reviewed-catalogue-update.mjs --manifest="$MANIFEST"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-catalogue-update-${{ github.run_id }}
          path: reviewed-catalogue-update/
          if-no-files-found: error
          retention-days: 90
