name: Security and quality

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # The repository keeps `package-lock.json` and no bun lockfile. Bun 1.3
      # silently migrated one at audit time; bun 1.4, which the runners picked
      # up on 29 August, refuses with "missing lockfile, nothing to audit" — so
      # every run on every branch has been red since. `npm audit` reads the
      # lockfile this repository actually maintains.
      #
      # `--package-lock-only` because the install above was bun's: plain
      # `npm audit` walks the npm-installed tree and fails with "loadVirtual
      # requires existing shrinkwrap file". The lockfile alone is what we want
      # audited anyway.
      - run: npm audit --audit-level=high --package-lock-only
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
