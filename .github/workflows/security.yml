name: Security and quality

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Now that `bun.lock` is committed this installs the resolved versions
      # rather than re-resolving `package.json` on every run, and `--frozen`
      # means what it says.
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
